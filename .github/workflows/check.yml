name: Checks
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python tests/run.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check html/app.js && node --check html/map/map.js
      - run: npm install --prefix "$RUNNER_TEMP/sh-pause-tests" playwright
      - run: "$RUNNER_TEMP/sh-pause-tests/node_modules/.bin/playwright install --with-deps chromium"
      - run: node tests/browser.cjs
        env:
          NODE_PATH: ${{ runner.temp }}/sh-pause-tests/node_modules
      - run: python tools/package.py
